<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entrar — Beast Mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg:#000000; --bg-surface:#121212; --bg-raised:#1C1C1E;
    --border:rgba(255,255,255,0.08);
    --primary:#A5D6A7; --primary-hover:#8BC490; --on-primary:#06280A;
    --tertiary:#FFB74D;
    --text-primary:#E2E2E6; --text-secondary:#90909A; --text-tertiary:#6B6B75;
    --success:#A5D6A7; --danger:#F2B8B5;
  }
  @media (prefers-color-scheme: light){
    :root{
      color-scheme: light;
      --bg:#F4F3F7; --bg-surface:#FFFBFE; --bg-raised:#E7E0EC;
      --border:rgba(0,0,0,0.08);
      --primary:#2E7D32; --primary-hover:#256628; --on-primary:#FFFFFF;
      --tertiary:#B25E09;
      --text-primary:#1C1B1E; --text-secondary:#49454F; --text-tertiary:#79747E;
      --success:#2E7D32; --danger:#B3261E;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text-primary);
    font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1{font-family:'Inter',sans-serif;font-weight:800;letter-spacing:-0.01em;margin:0;}
  main{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:48px 24px;}
  .wrap{width:100%;max-width:384px;}
  .hero{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;}
  .plates{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .plate{height:6px;border-radius:999px;background:var(--primary);}
  .card{margin-top:40px;border-radius:20px;background:var(--bg-surface);padding:24px;}
  label{font-size:14px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:6px;}
  input{width:100%;border-radius:14px;border:1px solid var(--border);background:var(--bg-raised);
    color:var(--text-primary);padding:13px 16px;font-size:15px;outline:none;transition:border-color .15s;}
  input::placeholder{color:var(--text-tertiary);}
  input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 20%, transparent);}
  button{margin-top:16px;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border-radius:999px;border:none;background:var(--primary);color:var(--on-primary);
    font-family:'Inter',sans-serif;font-weight:700;font-size:15px;padding:15px 24px;cursor:pointer;
    transition:background-color .15s;}
  button:hover{background:var(--primary-hover);}
  button:disabled{opacity:.4;pointer-events:none;}
  .msg{margin-top:14px;font-size:14px;display:none;}
  .msg.ok{color:var(--success);display:block;}
  .msg.err{color:var(--danger);display:block;}
  .footnote{margin-top:24px;text-align:center;font-size:12px;color:var(--text-tertiary);}
  .back{margin-top:18px;text-align:center;}
  .back a{color:var(--text-tertiary);font-size:12px;}
</style>
</head>
<body>
<main>
  <div class="wrap">
    <div class="hero">
      <div class="plates" aria-hidden="true">
        <div class="plate" style="width:44px;opacity:1"></div>
        <div class="plate" style="width:32px;opacity:.78"></div>
        <div class="plate" style="width:22px;opacity:.56"></div>
      </div>
      <div>
        <h1 style="font-size:24px;">Beast Mode</h1>
        <p style="margin:6px 0 0;font-size:14px;color:var(--text-secondary);">Entra com o teu email. Sem password.</p>
      </div>
    </div>

    <div class="card">
      <form id="f">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="o-teu-email@exemplo.com" autocomplete="email" required />
        <button type="submit" id="btn">Enviar link mágico</button>
        <p class="msg" id="msg"></p>
      </form>
    </div>

    <p class="footnote">Recebes um link por email. Ao clicares, entras diretamente.</p>
    <div class="back"><a href="index.html">← Voltar</a></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  const sb = window.supabase.createClient(BM_CONFIG.SUPABASE_URL, BM_CONFIG.SUPABASE_ANON_KEY);
  const f = document.getElementById('f'), btn = document.getElementById('btn'), msg = document.getElementById('msg');

  sb.auth.getSession().then(({data:{session}}) => { if (session) location.href = 'app.html'; });

  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true; btn.textContent = 'A enviar…';
    msg.className = 'msg';
    const email = document.getElementById('email').value.trim();
    const { error } = await sb.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: location.origin + location.pathname.replace('login.html','app.html') }
    });
    if (error) {
      msg.textContent = 'Não foi possível enviar o link. Tenta novamente.';
      msg.className = 'msg err';
      btn.disabled = false; btn.textContent = 'Enviar link mágico';
    } else {
      msg.textContent = 'Link enviado. Verifica o teu email.';
      msg.className = 'msg ok';
      btn.textContent = 'Enviado ✓';
    }
  });
</script>
</body>
</html>
